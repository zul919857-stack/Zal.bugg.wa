<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAL ANONYMOUS WA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{padding:25px 20px;text-align:center;background:#150707;border-bottom:1px solid #ff3030}
header h1{margin:0;color:#ff3030;font-size:27px}
header p{color:#aaa;font-size:13px}
main{max-width:480px;margin:25px auto;padding:20px}
.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:22px}
label{display:block;margin:17px 0 8px;color:#ddd;font-size:14px}
input,textarea{width:100%;padding:14px;background:#080808;border:1px solid #393939;border-radius:10px;color:#fff;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:#ff3030}
textarea{height:130px;resize:vertical}
button{width:100%;padding:15px;border:0;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:15px}
.primary{background:#ff3030;color:#fff}
.secondary{background:#262626;color:#fff}
.note{margin-top:18px;color:#999;font-size:12px;line-height:1.6}
.status{font-size:13px;color:#ff7777;margin-top:12px;line-height:1.5}
footer{text-align:center;color:#666;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>⚡ ZAL ANONYMOUS WA</h1>
  <p>WhatsApp Message Launcher</p>
</header>

<main>
  <div class="card">
    <label>Nomor referensi</label>
    <input id="sender" value="+14846695735" readonly>

    <label>Nomor WhatsApp target</label>
    <input id="target" type="tel" placeholder="Contoh: 628123456789">

    <label>Pesan kamu</label>
    <textarea id="message" placeholder="Tulis pesan di sini..."></textarea>

    <button class="primary" onclick="openWhatsApp()">BUKA CHAT WHATSAPP</button>
    <button class="secondary" onclick="copyReference()">SALIN NOMOR REFERENSI</button>
    <button class="secondary" onclick="resetForm()">RESET</button>

    <div class="status" id="status"></div>
    <p class="note">
      Nomor referensi bukan nomor pengirim terverifikasi.
      Pesan dikirim melalui akun WhatsApp yang kamu gunakan.
      Aplikasi ini tidak memalsukan identitas pengirim.
    </p>
  </div>
</main>

<footer>ZAL TOOLS © 2026</footer>

<script>
function openWhatsApp(){
  const target=document.getElementById('target').value.replace(/\D/g,'');
  const message=document.getElementById('message').value.trim();
  const status=document.getElementById('status');

  if(target.length<8){
    status.textContent='Masukkan nomor target dengan kode negara, misalnya 628123456789.';
    return;
  }

  if(!message){
    status.textContent='Tulis pesan terlebih dahulu.';
    return;
  }

  status.textContent='Membuka WhatsApp...';
  const url='https://wa.me/'+target+'?text='+encodeURIComponent(message);
  window.location.href=url;
}

function copyReference(){
  const value=document.getElementById('sender').value;
  if(navigator.clipboard){
    navigator.clipboard.writeText(value)
      .then(()=>document.getElementById('status').textContent='Nomor referensi berhasil disalin.')
      .catch(()=>fallbackCopy(value));
  }else{
    fallbackCopy(value);
  }
}

function fallbackCopy(value){
  const el=document.createElement('textarea');
  el.value=value;
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  el.remove();
  document.getElementById('status').textContent='Nomor referensi disalin.';
}

function resetForm(){
  document.getElementById('target').value='';
  document.getElementById('message').value='';
  document.getElementById('status').textContent='';
}
</script>
</body>
</html>
